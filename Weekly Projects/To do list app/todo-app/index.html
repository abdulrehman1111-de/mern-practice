<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="bg-[#14120F] text-[#EDE7DC] min-h-screen font-sans px-6 py-10 flex items-center flex-col">
    <h1 class="text-3xl font-semibold mb-6 text-[#EDE7DC]">To Do List App</h1>

    <label for="inputTxt" class="flex gap-3 mb-8">
        <input type="text" name="" id="inputTxt" placeholder="Enter your notes here" class="bg-[#1C1A17] border-2 border-[#3A362F] text-[#EDE7DC] placeholder:text-[#6B6459] rounded-lg px-4 py-2 focus:outline-none focus:border-[#D4A15F] transition-colors w-64">
        <button id="addBtn" class="bg-[#D4A15F] text-[#14120F] font-medium px-5 py-2 rounded-lg hover:bg-[#E0B274] transition-colors">Add</button>
    </label>

    <div id="section2" class="section2 h-auto w-full max-w-md border border-[#3A362F] rounded-xl bg-[#1C1A17] p-4">
        <ul id="targetUl" class="space-y-2">
            
        </ul>
    </div>

    <script src="list.js"></script>
</body>
</html>
