<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="bg-[#0F0B14] text-[#EAE6F0] min-h-screen font-sans px-6 py-10 flex flex-col items-center">
    <h1 class="text-3xl font-semibold mb-6 text-[#EAE6F0]">To Do List App</h1>

    <label for="inputTxt" class="flex gap-3 mb-8">
        <input type="text" name="" id="inputTxt" placeholder="Enter your notes here" class="bg-[#1B1524] border-2 border-[#332A42] text-[#EAE6F0] placeholder:text-[#6E6480] rounded-lg px-4 py-2 focus:outline-none focus:border-[#C6FF3D] transition-colors w-64">
        <button id="addBtn" class="bg-[#C6FF3D] text-[#0F0B14] font-medium px-5 py-2 rounded-lg hover:bg-[#D9FF70] transition-colors">Add</button>
    </label>

    <div id="section2" class="section2 h-auto w-full max-w-md border border-[#332A42] rounded-xl bg-[#1B1524] p-4">
        <ul id="targetUl" class="space-y-2">
            
        </ul>
    </div>

    <script src="list.js"></script>
</body>
</html>
