<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            text-align: center;
            padding: 20px;
        }

        /* Container Layout */
        .error-container {
            max-width: 500px;
            width: 100%;
        }

        /* 404 Title Style */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #2c3e50;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        /* Error Messages */
        .error-heading {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a252f;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Call to Action Button */
        .home-btn {
            display: inline-block;
            background-color: #3498db;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            font-weight: 600;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .home-btn:hover {
            background-color: #2980b9;
        }

        .home-btn:active {
            transform: scale(0.98);
        }

        /* Responsive scaling for mobile devices */
        @media (max-width: 480px) {
            .error-code {
                font-size: 6rem;
            }
            .error-heading {
                font-size: 1.4rem;
            }
            .error-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-heading">Page Not Found</h1>
        <p class="error-message">Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="home-btn">Return to Homepage</a>
    </div>

</body>
</html>
