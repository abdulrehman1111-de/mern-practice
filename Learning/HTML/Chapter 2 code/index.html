<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- We can also change the color of links -->
<body link="green" vlink="red" alink="purple">

    <!-- Attributes in html: can be compulsory or optional, attributes are defined in the opening tag.  -->
    
    <!-- Headings in html -->
    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>
    <h4>This is heading 4</h4>
    <h5>This is heading 5</h5>
    <h6>This is heading 6</h6>

    <!-- para tag in html -->
    <p>This is paragraph</p>

    <!-- Anchor tag -->
    <a href="https://www.youtube.com/">Youtube page link</a>

    <!-- link: When you havent visited the link yet link color: blue -->
    <!-- visited link: When you have visited the link: vlink color: purple -->
    <!-- active link: When you click the link: alink color: red -->
    
</body>
</html>
